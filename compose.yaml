services:
  web-app:
    build:
      context: "."
    ports:
      - "8080:4000"
    volumes:
      - "./:/app"
    depends_on:
      - postgres-db:
          condition: service_healthy  
  postgres-db:
    image: postgres:16
    environment:
       POSTGRES_DB: theticketing
       POSTGRES_USER: ola
       POSTGRES_PASSWORD: jesuYiwola
    ports:
      -"5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ola -d theticketicketing"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    