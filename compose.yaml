services:
  web-app:
    build:
      context: "."
    ports:
      - "8080:4000"
    volumes:
      - "./:/app"
    depends_on:
       postgres-db:
          condition: service_healthy  
       migration:
          condition: service_completed_successfully
   
  postgres-db:
    image: postgres:16
    environment:
       POSTGRES_DB: ${Database}
       POSTGRES_USER: ${User}
       POSTGRES_PASSWORD: ${Password}
    ports:
      -   "${port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ola -d theticketing"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  migration:
    image: migrate/migrate
    volumes:
      - "./database:/migration"
    command: -path ./migration -database postgres://ola:jesuYiwola@postgres-db:5432/theticketing?sslmode=disable up 
    depends_on:
       postgres-db:
          condition: service_healthy
      